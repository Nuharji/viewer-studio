.prep-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;position:relative}
.prep-bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--accent);transition:width .2s ease}
.prep-row{display:flex;justify-content:space-between;gap:10px;color:var(--dim);margin-top:8px}
video.player{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
audio.player{display:none}
.media-wrap.idle{cursor:none}
.media-wrap.idle .controls{opacity:0;pointer-events:none}
.controls{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;transition:opacity .25s}
.ctl-row{display:flex;align-items:center;gap:6px}
.cbtn{width:32px;height:30px;border:0;background:none;color:#fff;border-radius:6px;display:grid;place-items:center;cursor:pointer}
.cbtn:hover{background:rgba(255,255,255,.16)}.cbtn.on{color:#8ab4ff}
.cbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.time{font-variant-numeric:tabular-nums;font-size:12px;opacity:.9;margin-left:4px}
.ab-label{font-size:11px;color:#ffd166;margin-right:6px}
.controls select{background:rgba(255,255,255,.12);color:#fff;border:0;height:24px;border-radius:5px}
.controls select option{color:#000}
#vol{width:90px;max-width:90px;accent-color:#fff}
.seek{position:relative;height:16px;margin-bottom:4px}
.seek input{position:absolute;inset:0;width:100%;max-width:none;margin:0;accent-color:#e8e8e8;background:transparent;z-index:2}
.seek .buf,.seek .ab{position:absolute;top:6px;height:4px;border-radius:2px;pointer-events:none}
.seek .buf{left:0;background:rgba(255,255,255,.25)}.seek .ab{background:#ffd166;opacity:.8}
.seek .tip{position:absolute;bottom:20px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:2px 6px;border-radius:4px;font-size:11px;opacity:0;pointer-events:none}
.seek:hover .tip{opacity:1}
.audio-card{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:70px;color:#ddd;text-align:center;max-width:80%}
.stage.bg-light .audio-card,.stage.bg-checker .audio-card{color:#222}
.cover{width:min(300px,40vh);height:min(300px,40vh);border-radius:12px;background:linear-gradient(135deg,var(--tile-a),var(--tile-b));display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover svg{width:40%;height:40%;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.a-title{font-size:20px;font-weight:650;margin-top:8px}.a-sub{opacity:.75}
::cue{background:rgba(0,0,0,.65);font-size:1.05em}
/* Stage: grid of a folder */
.grid{position:absolute;inset:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));grid-auto-rows:max-content;align-content:start;gap:10px;padding:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:5px;padding:6px;background:var(--card-bg);border:2px solid transparent;border-radius:8px;color:var(--text);text-align:left;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--dim)}.tile.on{border-color:var(--accent)}
.tile-img{height:128px;display:grid;place-items:center;overflow:hidden;border-radius:4px;background:var(--code-bg);color:var(--dim)}
.tile-img img{width:100%;height:100%;object-fit:contain}
.tile-img svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tile-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-none{grid-column:1/-1;color:#aaa;text-align:center;padding:60px 20px}
/* Stars and labels */
.mark{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mark .st{color:#ffb300;letter-spacing:-1px}
.mark .co{width:10px;height:10px;border-radius:50%;display:inline-block}
.co-red{background:#e5484d}.co-yellow{background:#f5c518}.co-green{background:#30a46c}.co-blue{background:#3e8eed}
.tile-mark{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);border-radius:4px;padding:0 5px;color:#fff}
.tile-mark:empty{display:none}
.fitem .mark{grid-column:2/4}
.rate{display:flex;align-items:center;justify-content:space-between;padding:3px 0}.rate>span{color:var(--dim)}
.rate button{background:none;border:0;padding:0 2px;cursor:pointer;font-size:14px;color:var(--dim);line-height:1}.rate button.on{color:#ffb300}
.rate button .co{width:12px;height:12px;border-radius:50%;display:inline-block;opacity:.45}.rate button.on .co{opacity:1;outline:2px solid var(--strong);outline-offset:1px}
.hist{display:block;width:100%;height:70px;background:var(--code-bg);border-radius:4px}
.org-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.org-row select{max-width:130px}
.org-dir{height:26px;min-width:26px;border-radius:var(--radius);border:1px solid var(--input-border);background:none}
.org-dir:hover{background:var(--hover)}
/* Stage: two photos side by side */
.cmp{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cmp-pane{position:relative;overflow:hidden;cursor:grab;border:2px solid transparent}
.cmp-pane.on{border-color:var(--accent)}
.cmp-pane img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none}
.cmp-label{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 7px;max-width:calc(100% - 16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Tracks, chapters */
.seek .chaps{position:absolute;inset:0;pointer-events:none;z-index:3}
.seek .chaps i{position:absolute;top:5px;width:2px;height:6px;background:#ffd166}
#trackBox{display:flex;gap:4px;min-width:0}
#trackBox select{max-width:150px}
/* Queue */
.qrow{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;border-radius:var(--radius);min-width:0}
.qrow:hover{background:var(--hover)}.qrow.on{border-color:var(--accent);background:var(--hover)}
.qrow.drag{opacity:.6;background:var(--hover)}
.qgrip{cursor:ns-resize;color:var(--dim);text-align:center;touch-action:none}
.qname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.qbtns{display:flex;gap:1px}.qbtns button{background:none;border:0;color:var(--dim);border-radius:3px;cursor:pointer;width:20px}.qbtns button:hover{background:var(--chrome);color:var(--strong)}
/* 3D */
.model-box{position:absolute;inset:0}
.model-box canvas{display:block;outline:0}
/* Start screen */
.formats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;max-width:640px;margin-top:6px}
.formats div{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px;text-align:left}
.formats b{display:flex;align-items:center;gap:6px;color:var(--strong);margin-bottom:4px}
.formats svg,.ficon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.formats small{color:var(--dim);line-height:1.5}
.recent .ficon{color:var(--accent);display:grid}
/* Side panel */
.flist{display:flex;flex-direction:column;gap:2px}
.fitem{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:var(--radius);padding:3px 6px;text-align:left;cursor:pointer;min-width:0}
.fitem:hover{background:var(--hover)}.fitem.on{border-color:var(--accent);background:var(--hover)}
.fitem img,.fitem .ficon{width:44px;height:32px;border-radius:3px;object-fit:cover;background:var(--code-bg);display:grid;place-items:center;color:var(--dim)}
.fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fitem small{color:var(--dim)}
.note-in{width:100%;min-height:70px;resize:vertical;background:var(--input-bg);color:var(--text);border:1px solid var(--input-border);border-radius:var(--radius);padding:6px 8px;font:inherit;outline:0}
.note-in:focus{border-color:var(--accent)}
.note{border:1px solid var(--card-border);background:var(--card-bg);border-radius:6px;padding:6px 8px;margin:6px 0}
.note-h{display:flex;align-items:center;gap:6px}
.note-t{white-space:pre-wrap;line-height:1.5;user-select:text}
.note .x{background:none;border:0;color:var(--dim);cursor:pointer;border-radius:3px}.note .x:hover{background:var(--hover);color:var(--strong)}
.tstamp{background:var(--hover);border:0;border-radius:4px;padding:1px 6px;color:var(--accent);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.hint{color:var(--dim);line-height:1.5}
/* Full screen and slideshow: only the picture */
body.full{grid-template-rows:1fr}
body.full .menubar,body.full .optbar,body.full .tools,body.full .dock,body.full .status,body.full .tabs{display:none!important}
body.full .main{grid-row:1;grid-template-columns:1fr}
body.slideshow .stage{cursor:none}
/* Mini player: the same window, small and above the others; only the picture and the most important controls */
body.mini{grid-template-rows:1fr}
body.mini .menubar,body.mini .optbar,body.mini .tools,body.mini .dock,body.mini .status,body.mini .tabs{display:none!important}
body.mini .main{grid-row:1;grid-template-columns:1fr}
body.mini #trackBox,body.mini #speed,body.mini #vol,body.mini .ab-label,body.mini [data-act="snapshot"],body.mini [data-act="back10"]{display:none}
body.mini .cover{width:90px;height:90px}body.mini .audio-card{margin-bottom:56px;gap:4px}body.mini .a-title{font-size:14px;margin-top:0}
#stZoom,#stTime{font-variant-numeric:tabular-nums}
</style>
